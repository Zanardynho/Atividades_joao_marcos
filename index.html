<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Calculadora</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
      font-family: Arial, Helvetica, sans-serif; background: #eef3f8; color: #183247;
    }
    .calculadora {
      width: 100%; max-width: 440px; background: #fff; padding: 30px;
      border-radius: 18px; box-shadow: 0 12px 35px rgba(24,50,71,.12);
    }
    h1 { text-align: center; font-size: 28px; margin: 0 0 26px; color: #183e5b; }
    label { display: block; font-size: 14px; font-weight: 700; margin: 0 0 8px; }
    input {
      width: 100%; padding: 15px; margin-bottom: 16px; font-size: 17px;
      border: 1px solid #b8c7d6; border-radius: 9px; outline: none;
    }
    input:focus { border-color: #246b9e; box-shadow: 0 0 0 3px rgba(36,107,158,.12); }
    .linha { display: flex; gap: 10px; margin-bottom: 10px; }
    button {
      flex: 1; border: 0; border-radius: 9px; padding: 15px 10px;
      background: #246b9e; color: white; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: .15s;
    }
    button:hover { background: #19577f; transform: translateY(-1px); }
    button:active { transform: scale(.98); }
    .resultado {
      margin-top: 20px; padding: 20px; border-radius: 10px;
      background: #dceaf5; text-align: center; font-size: 18px;
      font-weight: 700; min-height: 64px; overflow-wrap: anywhere;
    }
    .resultado.erro { background: #fff0ef; color: #a12d25; }
    .rodape { text-align: center; color: #6d7f8d; font-size: 12px; margin-top: 20px; }
    @media (max-width: 380px) {
      .calculadora { padding: 22px; }
      button { font-size: 13px; padding: 13px 6px; }
    }
  </style>
</head>
<body>
  <main class="calculadora">
    <h1>Minha Calculadora</h1>

    <label for="numero1">Primeiro número</label>
    <input id="numero1" type="number" step="any" inputmode="decimal" placeholder="Digite o primeiro número" />

    <label for="numero2">Segundo número</label>
    <input id="numero2" type="number" step="any" inputmode="decimal" placeholder="Digite o segundo número" />

    <div class="linha">
      <button type="button" onclick="calcular('+')">Somar +</button>
      <button type="button" onclick="calcular('-')">Subtrair −</button>
    </div>
    <div class="linha">
      <button type="button" onclick="calcular('*')">Multiplicar ×</button>
      <button type="button" onclick="calcular('/')">Dividir ÷</button>
    </div>

    <div id="resultado" class="resultado" role="status" aria-live="polite">
      O resultado aparecerá aqui
    </div>
    <div class="rodape">Calculadora simples • Operações matemáticas básicas</div>
  </main>

  <script>
    function calcular(operacao) {
      const campo1 = document.getElementById('numero1');
      const campo2 = document.getElementById('numero2');
      const areaResultado = document.getElementById('resultado');

      const texto1 = campo1.value.trim();
      const texto2 = campo2.value.trim();

      function mostrarMensagem(mensagem, erro = true) {
        areaResultado.textContent = mensagem;
        areaResultado.classList.toggle('erro', erro);
      }

      // TODO 1: verificar se os dois campos foram preenchidos.
      if (texto1 === '' || texto2 === '') {
        mostrarMensagem('Preencha os dois números para realizar a operação.');
        return;
      }

      const n1 = Number(texto1);
      const n2 = Number(texto2);

      // TODO 2: verificar se os valores são números válidos.
      if (!Number.isFinite(n1) || !Number.isFinite(n2)) {
        mostrarMensagem('Digite números válidos.');
        return;
      }

      let valor;

      // TODO 3: implementar as quatro operações matemáticas.
      if (operacao === '+') {
        valor = n1 + n2;
      } else if (operacao === '-') {
        valor = n1 - n2;
      } else if (operacao === '*') {
        valor = n1 * n2;
      } else if (operacao === '/') {
        // TODO 4: impedir divisão por zero.
        if (n2 === 0) {
          mostrarMensagem('Não é possível realizar divisão por zero.');
          return;
        }
        valor = n1 / n2;
      } else {
        mostrarMensagem('Operação inválida.');
        return;
      }

      // TODO 5: apresentar o resultado na interface.
      mostrarMensagem('Resultado: ' + String(valor), false);
    }
  </script>
</body>
</html>
